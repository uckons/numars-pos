<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Nu Mars</title>
  <desc id="description">Nu Mars Spa, Karaoke, Lounge</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d47a"/>
      <stop offset="0.5" stop-color="#c89d45"/>
      <stop offset="1" stop-color="#f1ca68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>
  <rect width="720" height="320" rx="18" fill="#090909"/>
  <rect x="12" y="12" width="696" height="296" rx="12" fill="none" stroke="#c9a24d" stroke-opacity=".35"/>
  <g fill="url(#gold)" text-anchor="middle" filter="url(#shadow)" font-family="Arial Black, Arial, sans-serif">
    <text x="360" y="170" font-size="108" font-weight="900" letter-spacing="-6">Nu Mars</text>
    <text x="360" y="232" font-size="29" font-weight="700" letter-spacing="7">SPA - KARAOKE - LOUNGE</text>
  </g>
</svg>
