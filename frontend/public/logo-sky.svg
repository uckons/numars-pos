<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="title description">
  <title id="title">Nu Mars</title>
  <desc id="description">Nu Mars Spa - Karaoke - Lounge</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c651e"/>
      <stop offset="0.22" stop-color="#d7a449"/>
      <stop offset="0.5" stop-color="#f0c66b"/>
      <stop offset="0.76" stop-color="#b77927"/>
      <stop offset="1" stop-color="#e0af55"/>
    </linearGradient>
    <filter id="texture" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="14" result="noise"/>
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
  </defs>
  <rect width="600" height="200" fill="#fff"/>
  <g fill="url(#gold)" stroke="#18120a" stroke-width="1.3" paint-order="stroke" text-anchor="middle" filter="url(#texture)" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif">
    <text x="300" y="124" font-size="112" font-weight="900" letter-spacing="3">Nu Mars</text>
    <text x="300" y="174" font-size="31" font-weight="900" letter-spacing="2">SPA - KARAOKE - LOUNGE</text>
  </g>
</svg>
